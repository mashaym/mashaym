name: generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: mashaym
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237A9471&color_dots=%23ebedf0,%23cddcc4,%23a9c496,%2391b579,%237A9471
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23B5C9A3&color_dots=%23161b22,%232d4a2f,%233f6b3f,%235c8a52,%23B5C9A3

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
